name: automatic release

# The dependency fixes merged on main, released as a patch version (B355, B505,
# B506). Every hour, tools/release-plan reads main since the last tag:
#
#   release  the version proposal: the branch `release-watch` with the next
#            patch version, in a pull request the gates and the installation
#            test run on, merged by `merge` once they passed
#   tag      that proposal is merged, and its checks passed on its head: two
#            builds of the merge on two runners, compared; the tag on that
#            merge, and the release with the first build's files. The tag
#            starts apt-repo.yml, which builds twice more, compares with the
#            release's files, signs and publishes. What landed on main after
#            the merge is the next release's
#   rebuild  the last tag is this workflow's and has no release (the build
#            failed after the tag was pushed): the tagged commit is built
#            twice and compared again and the release is made; no new tag
#   blocked  a person's change is on main since the tag; nothing is released,
#            and while a security fix waits behind it an issue says so
#   wait, nothing
#
# The package repository is asked too: when it serves no haprion-cli of the
# last tag three hours after its release, an issue says so (apt-repo.yml's run
# may have been replaced, or failed).
#
# A release made by hand starts by building the automatic ones since the last
# one again and comparing (B506); tools/release-plan's documentation says
# what counts as a security fix.
#
# Everything that writes is done as the upstream watch's GitHub App: a pull
# request the workflow's own token opens runs no checks, and a tag it pushes
# starts no workflow.
on:
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-release
  cancel-in-progress: false

env:
  BRANCH: release-watch
  BLOCKED_TITLE: "A security fix waits for a release made by hand"
  UNPUBLISHED_TITLE: "The package repository does not serve the latest release"
  RED_TITLE: "The version proposal has been red for a day"

jobs:
  plan:
    name: What main holds since the last release
    if: github.repository == 'haprion/haprion'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read # whether the proposal's checks passed on its head
      pull-requests: read # who opened each merged pull request, and the commit it was merged as
    outputs:
      outcome: ${{ steps.plan.outputs.outcome }}
      next: ${{ steps.plan.outputs.next }}
      security: ${{ steps.plan.outputs.security }}
      tag_commit: ${{ steps.plan.outputs.tag_commit }}
      repository: ${{ steps.plan.outputs.repository }}
      ready: ${{ steps.gates.outputs.ready }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A commit's author name is only a name. What GitHub says of each pull
      # request merged since the tag - who opened it, which commit it was
      # merged as - is what lets a merge be counted as the watch's (B507). One
      # the API does not know is left out, and the plan blocks on it. The last
      # tag's release, and the haprion-cli versions the repository lists, are
      # asked as well; a repository that cannot be read is not reported.
      - name: Decide
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag=$(git describe --tags --abbrev=0 --match 'v*' HEAD)
          pulls="${RUNNER_TEMP}/pulls.jsonl"
          : > "${pulls}"
          for number in $(git log --first-parent --format=%s "${tag}^..HEAD" \
              | sed -n 's/^Merge pull request #\([0-9][0-9]*\) .*/\1/p'); do
            gh api "repos/${REPOSITORY}/pulls/${number}" \
              --jq '{number: .number, author: .user.login, merge_commit_sha: .merge_commit_sha}' \
              >> "${pulls}" || echo "pull request #${number} is not known to GitHub"
          done
          jq -s . "${pulls}" > "${RUNNER_TEMP}/pulls.json"
          known=()
          if release=$(gh api "repos/${REPOSITORY}/releases/tags/${tag}" 2>"${RUNNER_TEMP}/release.err"); then
            known+=(--last-release present --released-at "$(jq -r .created_at <<<"${release}")")
          elif grep -q "HTTP 404" "${RUNNER_TEMP}/release.err"; then
            known+=(--last-release missing)
          else
            cat "${RUNNER_TEMP}/release.err" >&2
            exit 1
          fi
          if curl --fail --silent --show-error --retry 3 --max-time 60 \
              "https://haprion.github.io/haprion/dists/deb13/main/binary-amd64/Packages" \
              --output "${RUNNER_TEMP}/Packages"; then
            awk 'BEGIN { RS = ""; FS = "\n" }
                 { cli = 0; version = ""
                   for (i = 1; i <= NF; i++) {
                     if ($i == "Package: haprion-cli") cli = 1
                     if ($i ~ /^Version: /) version = substr($i, 10)
                   }
                   if (cli && version != "") print version }' \
              "${RUNNER_TEMP}/Packages" > "${RUNNER_TEMP}/published.txt"
            known+=(--published "${RUNNER_TEMP}/published.txt")
          else
            echo "the package repository could not be read; what it serves is not checked"
          fi
          python3 tools/release-plan decide --source . --pulls "${RUNNER_TEMP}/pulls.json" \
            "${known[@]}" --notes "${RUNNER_TEMP}/notes.md" | tee "${RUNNER_TEMP}/plan.json"
          # The note of a release made late is the proposal's own text.
          if [[ "$(jq -r .outcome "${RUNNER_TEMP}/plan.json")" == rebuild ]]; then
            number=$(git log -1 --format=%s "$(jq -r .tag_commit "${RUNNER_TEMP}/plan.json")" \
              | sed -n 's/^Merge pull request #\([0-9][0-9]*\) .*/\1/p')
            gh api "repos/${REPOSITORY}/pulls/${number}" --jq .body > "${RUNNER_TEMP}/notes.md"
            test -s "${RUNNER_TEMP}/notes.md"
          fi
          {
            echo "outcome=$(jq -r .outcome "${RUNNER_TEMP}/plan.json")"
            echo "next=$(jq -r '.next // empty' "${RUNNER_TEMP}/plan.json")"
            echo "security=$(jq -r .security "${RUNNER_TEMP}/plan.json")"
            echo "tag_commit=$(jq -r '.tag_commit // empty' "${RUNNER_TEMP}/plan.json")"
            echo "pull_head=$(jq -r '.pull_head // empty' "${RUNNER_TEMP}/plan.json")"
            echo "repository=$(jq -r .repository "${RUNNER_TEMP}/plan.json")"
          } >> "${GITHUB_OUTPUT}"
          jq -r '"\(.outcome): \(.reason)"' "${RUNNER_TEMP}/plan.json" >> "${GITHUB_STEP_SUMMARY}"

      # The checks ran on the proposal's head, and the merge's tree is that
      # head's (the plan holds it to that). Each is asked for by name, and the
      # latest run of it counts: a run that was cancelled or run again is not
      # the answer. Until both passed, the next run asks again.
      - name: The proposal's checks on its head
        id: gates
        if: steps.plan.outputs.outcome == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_HEAD: ${{ steps.plan.outputs.pull_head }}
          REQUIRED: |
            Source, quality, and security gates
            Installation test
        run: |
          set -euo pipefail
          ready=true
          while IFS= read -r name; do
            [[ -z "${name}" ]] && continue
            conclusion=$(gh api --method GET "repos/${REPOSITORY}/commits/${PULL_HEAD}/check-runs" \
              -f check_name="${name}" -f filter=latest --jq '.check_runs[0].conclusion // empty')
            echo "${name} on ${PULL_HEAD}: ${conclusion:-not finished}"
            [[ "${conclusion}" == success ]] || ready=false
          done <<<"${REQUIRED}"
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

      - name: Keep the note
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-note
          path: ${{ runner.temp }}/notes.md
          retention-days: 7
          if-no-files-found: error

  report:
    name: Say when a security fix waits, the proposal stays red or the repository lags
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The app's key is this environment's secret. Not a deployment: every run
    # would otherwise be one, on the repository's front page.
    environment:
      name: upstream-watch
      deployment: false
    permissions:
      contents: read
      actions: read # when the proposal's checks first failed

    steps:
      - name: Act as the app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPSTREAM_WATCH_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_WATCH_PRIVATE_KEY }}
          permission-issues: write # the report
          permission-pull-requests: read # the version proposal

      - name: Open, keep or close the report
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          NOTIFY: ${{ vars.UPSTREAM_WATCH_NOTIFY }}
          OUTCOME: ${{ needs.plan.outputs.outcome }}
          SECURITY: ${{ needs.plan.outputs.security }}
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "${REPOSITORY}" --state open --search "in:title \"${BLOCKED_TITLE}\"" \
            --json number,title --jq "map(select(.title == env.BLOCKED_TITLE))[0].number // empty")
          if [[ "${OUTCOME}" == blocked && "${SECURITY}" == true ]]; then
            body="${RUNNER_TEMP}/body.md"
            { echo "A security fix is merged on main, and a change since the last release was not made by"
              echo "the upstream watch or Dependabot. An automatic release would ship it unreviewed, so"
              echo "none is made: the fix goes out with the next release made by hand."
            } > "${body}"
            if [[ -z "${open}" ]]; then
              gh issue create --repo "${REPOSITORY}" --title "${BLOCKED_TITLE}" --body-file "${body}" \
                ${NOTIFY:+--assignee "${NOTIFY}"}
            fi
          elif [[ -n "${open}" ]]; then
            gh issue close "${open}" --repo "${REPOSITORY}" --comment "Nothing waits behind a change made by hand."
          fi

      - name: Open, keep or close the report on the package repository
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          NOTIFY: ${{ vars.UPSTREAM_WATCH_NOTIFY }}
          PROBLEM: ${{ needs.plan.outputs.repository }}
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "${REPOSITORY}" --state open --search "in:title \"${UNPUBLISHED_TITLE}\"" \
            --json number,title --jq "map(select(.title == env.UNPUBLISHED_TITLE))[0].number // empty")
          if [[ -n "${PROBLEM}" ]]; then
            if [[ -z "${open}" ]]; then
              body="${RUNNER_TEMP}/repository.md"
              { echo "${PROBLEM}."
                echo
                echo "The run of apt-repo.yml the tag started may have failed or been replaced by a later"
                echo "one (its concurrency group keeps one waiting run). Run it again for the tag."
              } > "${body}"
              gh issue create --repo "${REPOSITORY}" --title "${UNPUBLISHED_TITLE}" --body-file "${body}" \
                ${NOTIFY:+--assignee "${NOTIFY}"}
            fi
          elif [[ -n "${open}" ]]; then
            gh issue close "${open}" --repo "${REPOSITORY}" --comment "The repository serves the latest release."
          fi

      # The failed checks of an unchanged proposal are run again once a day
      # (the merge job); one that is still red after a day is not the
      # runner's bad luck.
      - name: Open, keep or close the report on a red proposal
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          NOTIFY: ${{ vars.UPSTREAM_WATCH_NOTIFY }}
        run: |
          set -euo pipefail
          open=$(gh issue list --repo "${REPOSITORY}" --state open --search "in:title \"${RED_TITLE}\"" \
            --json number,title --jq "map(select(.title == env.RED_TITLE))[0].number // empty")
          number=$(gh pr list --repo "${REPOSITORY}" --head "${BRANCH}" --author "app/${APP_SLUG}" --state open \
            --json number --jq '.[0].number // empty')
          first_failure=""
          if [[ -n "${number}" ]]; then
            head=$(gh pr view "${number}" --repo "${REPOSITORY}" --json headRefOid --jq .headRefOid)
            first_failure=$(GH_TOKEN="${RUN_TOKEN}" gh api --method GET "repos/${REPOSITORY}/actions/runs" \
              -f head_sha="${head}" -f status=failure \
              --jq '[.workflow_runs[].created_at] | min // empty')
          fi
          if [[ -n "${first_failure}" && "${first_failure}" < "$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)" ]]; then
            if [[ -z "${open}" ]]; then
              body="${RUNNER_TEMP}/red.md"
              { echo "The version proposal #${number} failed a check at ${first_failure}, and it has failed"
                echo "again when it was run again. No release is made until it passes: look at the"
                echo "failed job. Closing the proposal makes the workflow open it again."
              } > "${body}"
              gh issue create --repo "${REPOSITORY}" --title "${RED_TITLE}" --body-file "${body}" \
                ${NOTIFY:+--assignee "${NOTIFY}"}
            fi
          elif [[ -n "${open}" ]]; then
            gh issue close "${open}" --repo "${REPOSITORY}" --comment "The version proposal is not red."
          fi

  propose:
    name: Propose the next patch version
    needs: plan
    if: needs.plan.outputs.outcome == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: upstream-watch
      deployment: false

    steps:
      - name: Act as the app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPSTREAM_WATCH_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_WATCH_PRIVATE_KEY }}
          permission-contents: write # the proposal's branch
          permission-pull-requests: write # its pull request

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Fetch the note
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-note
          path: ${{ runner.temp }}/note

      # One proposal at a time: an open one is the merge job's to finish, or
      # a person's, when it carries `hold`.
      - name: Write the version and open the pull request
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.next }}
          NOTIFY: ${{ vars.UPSTREAM_WATCH_NOTIFY }}
        run: |
          set -euo pipefail
          open=$(gh pr list --repo "${REPOSITORY}" --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [[ -n "${open}" ]]; then
            echo "#${open} is open"
            exit 0
          fi
          python3 tools/release-plan bump --source . --version "${VERSION}"
          uv lock --project .
          uv lock --project ui
          git diff --stat
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git -c user.name="${APP_SLUG}[bot]" \
              -c user.email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
              commit --quiet --all --message "Version ${VERSION}"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="${auth}" push --quiet --force \
            "https://github.com/${REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          gh pr create --repo "${REPOSITORY}" --head "${BRANCH}" --base main \
            --title "Version ${VERSION}" --body-file "${RUNNER_TEMP}/note/notes.md" \
            ${NOTIFY:+--assignee "${NOTIFY}"}

  # Only while the plan says a release is due: that is when this workflow's
  # proposal can be open. It is the app's pull request, titled for the next
  # version, on the current main; any other is closed and made again by
  # `propose`.
  merge:
    name: Merge the version proposal when every check passed
    needs: plan
    if: needs.plan.outputs.outcome == 'release'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: upstream-watch
      deployment: false
    permissions:
      contents: read
      actions: write # run the proposal's failed checks again

    steps:
      - name: Act as the app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPSTREAM_WATCH_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_WATCH_PRIVATE_KEY }}
          permission-contents: write # the merge writes main
          permission-pull-requests: write # and closes the pull request
          permission-checks: read # whether every check passed

      # As the locks' proposal (upstream-merge.yml): every check run and
      # passed on the head being merged, the named ones among them.
      - name: Merge when every check passed
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RUN_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.next }}
          REQUIRED: |
            Source, quality, and security gates
            Installation test
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "${REPOSITORY}" --head "${BRANCH}" --author "app/${APP_SLUG}" --state open \
            --json number,headRefOid,labels,title --jq '.[0] // empty')
          if [[ -z "${pr}" ]]; then
            echo "no proposal of the app is open"
            exit 0
          fi
          number=$(jq -r .number <<<"${pr}")
          head=$(jq -r .headRefOid <<<"${pr}")
          labels=$(jq -r '[.labels[].name] | join(" ")' <<<"${pr}")
          if [[ " ${labels} " == *" hold "* ]]; then
            echo "#${number} is on hold"
            exit 0
          fi
          if [[ "$(jq -r .title <<<"${pr}")" != "Version ${VERSION}" ]]; then
            gh pr close "${number}" --repo "${REPOSITORY}" --delete-branch \
              --comment "This is not the proposal for version ${VERSION}, the one the plan calls for. It is proposed again."
            exit 0
          fi
          # The tag stands on the merge, and the installation test ran on the
          # head: they are the same tree only when the head holds main. One
          # that lies behind is closed and its branch deleted, so that
          # `propose` makes it again on today's main.
          behind=$(gh api "repos/${REPOSITORY}/compare/main...${head}" --jq .behind_by)
          if [[ "${behind}" != 0 ]]; then
            gh pr close "${number}" --repo "${REPOSITORY}" --delete-branch \
              --comment "main moved on: this proposal lies ${behind} commits behind it, so what was tested is not what a merge would tag. It is proposed again on the current main."
            exit 0
          fi
          # An unchanged proposal gets no new checks, so a failure from
          # outside would hold it for good. A run that failed more than a day
          # ago is run again, which is once a day at most; a real failure
          # fails again and stays in view (the report job counts its age).
          for run in $(GH_TOKEN="${RUN_TOKEN}" gh api --method GET "repos/${REPOSITORY}/actions/runs" \
              -f head_sha="${head}" -f status=failure \
              --jq '.workflow_runs[] | select(.updated_at < (now - 86400 | todate)) | .id'); do
            echo "running the failed jobs of ${run} again"
            GH_TOKEN="${RUN_TOKEN}" gh api --method POST "repos/${REPOSITORY}/actions/runs/${run}/rerun-failed-jobs"
          done
          checks=$(gh pr checks "${number}" --repo "${REPOSITORY}" --json name,bucket || true)
          if jq -e 'any(.[]; .bucket != "pass" and .bucket != "skipping")' <<<"${checks}" >/dev/null; then
            echo "#${number}: not every check has passed"
            jq -r '.[] | "  \(.bucket)  \(.name)"' <<<"${checks}"
            exit 0
          fi
          while IFS= read -r name; do
            [[ -z "${name}" ]] && continue
            if ! jq -e --arg name "${name}" 'any(.[]; .name == $name and .bucket == "pass")' <<<"${checks}" >/dev/null; then
              echo "#${number}: '${name}' has not passed"
              exit 0
            fi
          done <<<"${REQUIRED}"
          gh pr merge "${number}" --repo "${REPOSITORY}" --merge --match-head-commit "${head}" --delete-branch

  build:
    name: Build the release (${{ matrix.copy }})
    needs: plan
    if: >-
      needs.plan.outputs.outcome == 'rebuild'
      || (needs.plan.outputs.outcome == 'tag' && needs.plan.outputs.ready == 'true')
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      matrix:
        copy: [a, b]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-release-packages --source . --output-dir "${RUNNER_TEMP}/out" \
            --uv "$(command -v uv)" --cache "${RUNNER_TEMP}/cache"
          cat "${RUNNER_TEMP}/out/SHA256SUMS"

      - name: Keep the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.copy }}
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: error

  release:
    name: Tag and release
    needs: [plan, build]
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: upstream-watch
      deployment: false

    steps:
      - name: Fetch both builds and the note
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/builds

      - name: The same bytes twice
        shell: bash
        working-directory: ${{ runner.temp }}/builds
        run: |
          set -euo pipefail
          diff release-a/SHA256SUMS release-b/SHA256SUMS
          cat release-a/SHA256SUMS

      - name: Act as the app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPSTREAM_WATCH_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_WATCH_PRIVATE_KEY }}
          permission-contents: write # the tag and the release

      - name: Check out the merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.tag_commit }}
          persist-credentials: false

      # The tag first and pushed with git, as a release made by hand does: the
      # push starts apt-repo.yml, whose comparison waits for the release's files.
      - name: Tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.next }}
          TAG_COMMIT: ${{ needs.plan.outputs.tag_commit }}
          OUTCOME: ${{ needs.plan.outputs.outcome }}
          BUILDS: ${{ runner.temp }}/builds
        run: |
          set -euo pipefail
          # `rebuild` is a tag already pushed whose release was never made.
          if [[ "${OUTCOME}" == tag ]]; then
            auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
            git -c http.extraheader="${auth}" push --quiet \
              "https://github.com/${REPOSITORY}.git" "${TAG_COMMIT}:refs/tags/v${VERSION}"
          fi
          gh release create "v${VERSION}" --repo "${REPOSITORY}" --verify-tag --title "v${VERSION}" --latest \
            --notes-file "${BUILDS}/release-note/notes.md" "${BUILDS}"/release-a/*
