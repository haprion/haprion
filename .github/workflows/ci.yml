name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Source, quality, and security gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Materialize required private denylist
        shell: bash
        env:
          HAPROXY_MANAGER_SECRET_RULES: ${{ runner.temp }}/haproxy-manager-private.rules
          PRIVATE_DENYLIST: ${{ secrets.HAPROXY_MANAGER_DENYLIST }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_DENYLIST}" ]]; then
            echo "CI: required repository secret HAPROXY_MANAGER_DENYLIST is missing" >&2
            exit 2
          fi
          umask 077
          python - <<'PY'
          import os
          from pathlib import Path

          Path(os.environ["HAPROXY_MANAGER_SECRET_RULES"]).write_text(
              os.environ["PRIVATE_DENYLIST"], encoding="utf-8"
          )
          PY

      - name: Install locked project and Python checks
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          printf '%s\n' "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

      - name: Install pinned standalone checks
        shell: bash
        run: |
          set -euo pipefail
          tools/install-gitleaks "${RUNNER_TEMP}/gitleaks"
          tools/install-shellcheck "${RUNNER_TEMP}/shellcheck"
          tools/install-actionlint "${RUNNER_TEMP}/actionlint"
          printf '%s\n' "${RUNNER_TEMP}/shellcheck" "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"

      - name: Run all source, quality, test, and dependency gates
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
          HAPROXY_MANAGER_SECRET_RULES: ${{ runner.temp }}/haproxy-manager-private.rules
        run: ./run-checks
