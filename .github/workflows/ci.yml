name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The jobs that prove a proposal of the upstream watch can also be run by
  # hand, to see them pass on the runner before the watch relies on them.
  workflow_dispatch:

permissions:
  contents: read

# A run by hand does not take the place of the push's run on the same branch
# (26-10-19: the push's was cancelled and main went untested).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every gate on both Pythons a supported distribution ships (B303): 3.13 is
  # the floor (Debian 13), 3.14 what Ubuntu 26.04 runs. An annotation that
  # only 3.14 evaluates lazily once broke an install the gate had passed.
  checks:
    name: Gates on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # The versions toolchain.json pins for this gate and the local one
        # alike (B494); a test holds the two equal. 3.14 is Ubuntu's own
        # /usr/bin/python3.14, the installations' interpreter, as it is on the
        # manager; setup-python has no 3.14.4 for 26.04 either.
        include:
          - python: "3.13.15"
            ubuntu: false
          - python: "3.14.4"
            ubuntu: true
    env:
      # Ahead of .python-version, which names the floor for local work. The
      # interpreter on PATH, never one uv downloads: setup-python's, or Ubuntu's.
      UV_PYTHON: ${{ matrix.python }}
      UV_PYTHON_PREFERENCE: only-system
    # The tests alone took 13 minutes on the private repository's two-core
    # runner on 2026-10-10, and 15 cancelled the run before it said anything.
    # By 2026-11-06 the job took 14 to 29 minutes, and 30 cancelled one in the
    # database tests while it was still passing them.
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: ${{ !matrix.ubuntu }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Materialize required private denylist
        shell: bash
        env:
          HAPRION_SECRET_RULES: ${{ runner.temp }}/haprion-private.rules
          PRIVATE_DENYLIST_B64: ${{ secrets.HAPRION_DENYLIST }}
        run: |
          set -euo pipefail
          if [[ -z "${PRIVATE_DENYLIST_B64}" ]]; then
            echo "CI: required repository secret HAPRION_DENYLIST is missing" >&2
            exit 2
          fi
          umask 077
          if ! printf '%s' "${PRIVATE_DENYLIST_B64}" \
              | base64 --decode > "${HAPRION_SECRET_RULES}"; then
            echo "CI: repository secret HAPRION_DENYLIST is not valid Base64" >&2
            exit 2
          fi

      - name: Install locked project and Python checks
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
        run: |
          set -euo pipefail
          uv sync --locked --group dev
          printf '%s\n' "${RUNNER_TEMP}/venv/bin" >> "${GITHUB_PATH}"

      # The interface is a separate distribution with its own lockfile, so it
      # needs its own environment. Its bin/ is deliberately NOT added to PATH:
      # it would shadow the engine's environment, and the gate is meant to run
      # the engine's tooling against both trees rather than the interface's
      # copy of it.
      - name: Install the locked interface environment
        shell: bash
        working-directory: ui
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv-ui
        run: |
          set -euo pipefail
          uv sync --locked --group dev

      # The chart is half script, and the browser suite drives it in a real
      # browser. Installed from the locked interface environment, so the
      # browser build matches the pinned Playwright rather than whatever the
      # runner image happens to carry, and placed outside any home directory.
      - name: Install the browser the interface suite drives
        shell: bash
        working-directory: ui
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/venv-ui/bin/playwright" install --with-deps chromium

      - name: Install pinned standalone checks
        shell: bash
        run: |
          set -euo pipefail
          tools/install-gitleaks "${RUNNER_TEMP}/gitleaks"
          tools/install-shellcheck "${RUNNER_TEMP}/shellcheck"
          tools/install-actionlint "${RUNNER_TEMP}/actionlint"
          printf '%s\n' "${RUNNER_TEMP}/shellcheck" "${RUNNER_TEMP}/actionlint" >> "${GITHUB_PATH}"

      # The database gate runs the interface's migrations, grants and SQL in a
      # disposable cluster of the major version installations run (18). Ubuntu
      # 26.04 ships it, as install/platform/ensure-postgresql takes it there;
      # the PostgreSQL project's repository was needed only on 24.04.
      - name: Install the PostgreSQL the database gate runs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get -o Acquire::Retries=5 update -q
          sudo apt-get -o Acquire::Retries=5 install -y -q postgresql-18

      # The runner image carries a newer git than Ubuntu ships; the gate runs
      # the one the manager and the installations get from the archive
      # (B494). The check at the start of the gate refuses any other.
      - name: Install the git the installations run
        shell: bash
        run: |
          set -euo pipefail
          want=$(python3 -c 'import json; print(json.load(open("toolchain.json"))["git"])')
          sudo apt-get -o Acquire::Retries=5 update -q
          # Read whole, then searched: `madison | awk '... exit'` stopped reading,
          # and apt-cache's broken pipe failed the step under pipefail.
          offered=$(apt-cache madison git)
          version=$(awk -v want="$want" '$3 ~ ("^1:" want "-") && !found {print $3; found = 1}' <<<"${offered}")
          if [[ -z "${version}" ]]; then
            echo "CI: no git ${want} in the configured archives" >&2
            printf '%s\n' "${offered}" >&2
            exit 2
          fi
          sudo apt-get -o Acquire::Retries=5 install -y -q --allow-downgrades \
            "git=${version}" "git-man=${version}"
          git --version

      - name: Run all source, quality, test, and dependency gates
        env:
          # More than one major can be on the runner image; the gate runs 18.
          HAPRION_PG_BINDIR: /usr/lib/postgresql/18/bin
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks/gitleaks
          HAPRION_SECRET_RULES: ${{ runner.temp }}/haprion-private.rules
          # Without this the gate refuses to run rather than skipping the
          # interface. That is the point of it: a gate that passes because it
          # could not import what it was asked to check is not a gate.
          HAPRION_UI_PYTHON: ${{ runner.temp }}/venv-ui/bin/python
          # Same rule again: no browser, no verdict. The interface gate refuses
          # to start rather than reporting a pass it did not earn.
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: ./run-checks

  # The rule set's own regression tests through the packages a proposal of the
  # upstream watch would publish (B337): the engine and the rules built from
  # its pins, behind the HAProxy branch the nodes run. Only on the watch's
  # pull requests, where the pins move; its merge waits for this to pass.
  crs-regression:
    name: Rule set regression tests
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.head_ref == 'upstream-watch')
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: false

      # From the repository a node gets it from, with the key the product
      # ships, at the branch the installation steps hold nodes to.
      - name: Install the HAProxy the nodes run
        shell: bash
        run: |
          set -euo pipefail
          branch=$(sed -n 's/^HAPROXY_BRANCH="\([0-9.]*\)"$/\1/p' install/node-lib.sh)
          codename=$(. /etc/os-release && echo "${VERSION_CODENAME}")
          sudo install -m 0644 src/haprion/apt-keys/haproxy-ubuntu-ppa.asc /etc/apt/keyrings/haproxy.asc
          echo "deb [signed-by=/etc/apt/keyrings/haproxy.asc] https://ppa.launchpadcontent.net/vbernat/haproxy-${branch}/ubuntu ${codename} main" \
            | sudo tee /etc/apt/sources.list.d/haproxy.list
          # The runner's apt reads only its amd64v3 variant's indexes, and the
          # PPA builds plain amd64: the distribution's older HAProxy won
          # (measured 26-10-19). The nodes use no variant; nor does this.
          # Retried: one 503 from Launchpad failed a whole run (26-10-21).
          novariant=(-o 'APT::Architecture-Variants=' -o Acquire::Retries=5)
          sudo apt-get "${novariant[@]}" update -q
          sudo apt-get "${novariant[@]}" install -y -q haproxy
          haproxy -v | grep "^HAProxy version ${branch}\." >/dev/null

      - name: Build the engine and the rules
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build-release-packages --source . --output-dir "${RUNNER_TEMP}/packages" \
            --uv "$(command -v uv)" --cache "${RUNNER_TEMP}/cache" --only waf

      - name: Run the rule set's regression tests
        shell: bash
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/venv
        run: |
          set -euo pipefail
          uv sync --locked --no-dev
          "${RUNNER_TEMP}/venv/bin/python" tools/crs-regression --source . \
            --packages "${RUNNER_TEMP}/packages" --cache "${RUNNER_TEMP}/cache"

  # A whole installation, manager and two nodes per distribution, from what
  # the repository would serve once the proposal is merged (B337): the latest
  # release's packages, with the engine and the rules built from the
  # proposal's pins in place of the release's.
  install-test:
    name: Installation test
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request'
          && (github.head_ref == 'upstream-watch' || github.head_ref == 'dependency-watch'
              || github.head_ref == 'release-watch'))
    runs-on: ubuntu-26.04
    timeout-minutes: 150

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.5"
          enable-cache: false

      # The version proposal (auto-release.yml) is a whole release: every
      # package is built from it, installed new and updated from the latest
      # release (B506). The watch's proposals change the engine and the rules,
      # and are tried with the release's other packages.
      - name: Build the engine and the rules, or the whole release
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          only=(--only waf)
          if [[ "${HEAD_REF}" == release-watch ]]; then
            only=()
          fi
          python3 tools/build-release-packages --source . --output-dir "${RUNNER_TEMP}/waf" \
            --uv "$(command -v uv)" --cache "${RUNNER_TEMP}/cache" "${only[@]}"

      # GitHub names a release's files with `.` where the package has `~`; each
      # is named again from its own control fields, as the build named it.
      - name: Take the latest release's packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          packages="${RUNNER_TEMP}/packages"
          mkdir -p "${RUNNER_TEMP}/release" "${packages}"
          gh release download --repo "${REPOSITORY}" --pattern '*.deb' --dir "${RUNNER_TEMP}/release"
          for deb in "${RUNNER_TEMP}"/release/*.deb; do
            # shellcheck disable=SC2016 # dpkg-deb's own fields, not the shell's
            name=$(dpkg-deb --show --showformat '${Package}_${Version}_${Architecture}.deb' "${deb}")
            cp "${deb}" "${packages}/${name}"
          done
          if [[ "${HEAD_REF}" == release-watch ]]; then
            mv "${packages}" "${RUNNER_TEMP}/previous"
            mkdir "${packages}"
          else
            rm -f "${packages}"/haprion-coraza-spoa_*.deb "${packages}"/haprion-crs_*.deb
          fi
          cp "${RUNNER_TEMP}"/waf/*.deb "${packages}/"
          ls -l "${packages}"

      - name: Install podman
        shell: bash
        run: |
          set -euo pipefail
          command -v podman || {
            sudo apt-get -o Acquire::Retries=5 update -q
            sudo apt-get -o Acquire::Retries=5 install -y -q podman
          }
          podman --version

      - name: Install on empty machines
        shell: bash
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          upgrade=(--no-upgrade)
          if [[ "${HEAD_REF}" == release-watch ]]; then
            upgrade=(--upgrade-from "${RUNNER_TEMP}/previous")
          fi
          python3 tools/install-test --packages "${RUNNER_TEMP}/packages" "${upgrade[@]}" --distribution all \
            --logs "${RUNNER_TEMP}/install-test-logs"

      - name: Keep what the machines said
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-test-logs
          path: ${{ runner.temp }}/install-test-logs/
          retention-days: 7

  # GitHub's schedule is best effort and drops a run without a trace
  # (26-10-20: the watch's first night never started). A watch that stopped
  # would say nothing, so every push and run by hand asks whether it still
  # runs. Not on pull requests: a contributor's change is not what broke it,
  # and the branch rule does not wait for it.
  upstream-watch-ran:
    name: The upstream watch still runs
    if: >-
      github.repository == 'haprion/haprion'
      && github.event_name != 'pull_request'
    # Where the watch itself runs the same tool.
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read # the watch's runs
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: A scheduled run inside the last 48 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 tools/upstream-watch ran --repository "${REPOSITORY}"

      # The hourly merges (B354): GitHub drops a scheduled run now and then, so
      # twelve hours, not one, before it is called stopped.
      - name: A scheduled merge run inside the last 12 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 tools/upstream-watch ran --repository "${REPOSITORY}" --workflow upstream-merge.yml --hours 12

      # The automatic release (B507). CI starts it too, so its schedule is the
      # safety net: runs started that way are not counted, only the schedule's.
      - name: A scheduled release run inside the last 12 hours
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 tools/upstream-watch ran --repository "${REPOSITORY}" --workflow auto-release.yml --hours 12

  # The branch rule requires this name. A matrix job reports one check per
  # Python, so this one stands for both and passes only when both did.
  gates:
    name: Source, quality, and security gates
    needs: checks
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Both Pythons passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "${RESULT}" = success

  # The automatic release is scheduled hourly, but GitHub ran the schedule three
  # to four times a day (26-11-13), so a fix merged at night waited. A run
  # started with workflow_dispatch from the workflow's own token does start
  # (the one event the token may start; GitHub's documentation on GITHUB_TOKEN),
  # so CI starts the release when what it waits for is done: the gates on a push
  # to main, and the gates and the installation test on the version proposal's
  # branch in this repository - never a fork's, whose code must not start
  # anything. Not a required check, and a start that fails is a warning: the
  # schedule still comes.
  start-release:
    name: Start the automatic release
    needs: [gates, install-test]
    if: >-
      always()
      && github.repository == 'haprion/haprion'
      && ((github.event_name == 'push'
           && github.ref == 'refs/heads/main'
           && needs.gates.result == 'success')
          || (github.event_name == 'pull_request'
              && github.head_ref == 'release-watch'
              && github.event.pull_request.head.repo.full_name == github.repository
              && needs.gates.result == 'success'
              && needs.install-test.result == 'success'))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: write # start a workflow
    steps:
      - name: Run the automatic release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh workflow run auto-release.yml --ref main --repo "${REPOSITORY}" \
            || echo "::warning::auto-release.yml was not started; the next scheduled run takes it up"
