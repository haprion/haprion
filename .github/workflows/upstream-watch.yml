name: upstream watch

# The WAF packages' upstream sources, watched every night (B323, B337):
#
#   vulnerabilities  govulncheck on the pinned engine against today's database;
#                    a finding opens an issue and makes the next proposal a
#                    security one (the engine side only, two days' wait)
#   propose          tools/upstream-watch rewrites the pins on the branch
#                    `upstream-watch` and keeps one pull request open for it;
#                    a major update is an issue that needs a decision, never a change;
#                    an unchanged proposal's failed checks run again
#   locks            the Python locks against today's advisories (B353): every
#                    package an advisory names a fix for is upgraded on the
#                    branch `dependency-watch`, in a pull request of its own that
#                    goes in once every check passed, with no wait - an advisory
#                    otherwise failed every pull request until somebody moved the
#                    lock; one that no upgrade clears is an issue for a person
#
# The merges are upstream-merge.yml's, every hour (B354).
#
# Everything that writes is done as the GitHub App, not with the workflow's own
# token: a pull request that token opens runs no checks, and a merge it makes
# starts no workflow - the proposal would go in untested and never be built.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-watch
  cancel-in-progress: false

env:
  BRANCH: upstream-watch
  VULNERABLE_TITLE: "The pinned WAF engine reaches a known vulnerability"
  MAJOR_TITLE: "Major upstream updates of the WAF packages need a decision"
  LOCKS_BRANCH: dependency-watch
  HELD_TITLE: "A locked dependency has a known vulnerability no upgrade clears"

jobs:
  vulnerabilities:
    name: The pinned engine against today's vulnerabilities
    if: github.repository == 'haprion/haprion'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      vulnerable: ${{ steps.scan.outputs.vulnerable }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run govulncheck
        id: scan
        shell: bash
        run: |
          # GitHub runs `bash -e`: the status is taken on the failing line,
          # or a finding (3) would end the step before it is reported.
          set -uo pipefail
          status=0
          python3 tools/upstream-watch vuln --source . --cache "${RUNNER_TEMP}/cache" \
            | tee "${RUNNER_TEMP}/vulnerabilities.txt" || status=$?
          case "${status}" in
            0) echo "vulnerable=false" >> "${GITHUB_OUTPUT}" ;;
            3) echo "vulnerable=true" >> "${GITHUB_OUTPUT}" ;;
            *) exit "${status}" ;;
          esac

      - name: Keep the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vulnerabilities
          path: ${{ runner.temp }}/vulnerabilities.txt
          retention-days: 7

  propose:
    name: Propose the newer upstream releases
    needs: vulnerabilities
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: upstream-watch
    permissions:
      contents: read
      actions: write # run a proposal's failed checks again

    steps:
      - name: Act as the app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPSTREAM_WATCH_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_WATCH_PRIVATE_KEY }}
          permission-contents: write # the proposal's branch
          permission-pull-requests: write # its pull request
          permission-issues: write # the vulnerability and the major updates

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the vulnerability report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vulnerabilities
          path: ${{ runner.temp }}/report

      - name: Report a reachable vulnerability, or close the report
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VULNERABLE: ${{ needs.vulnerabilities.outputs.vulnerable }}
          NOTIFY: ${{ vars.UPSTREAM_WATCH_NOTIFY }}
        run: |
          set -euo pipefail
          open=$(gh issue list --state open --search "in:title \"${VULNERABLE_TITLE}\"" \
            --json number,title --jq "map(select(.title == env.VULNERABLE_TITLE))[0].number // empty")
          if [[ "${VULNERABLE}" == true ]]; then
            body="${RUNNER_TEMP}/body.md"
            { echo "govulncheck finds a vulnerability the pinned engine reaches."
              echo "The next proposal is a security one: the engine side only, merged two days"
              echo "after its upstream release. Label it \`no-cooldown\` to merge it once green."
              echo; echo '```'; cat "${RUNNER_TEMP}/report/vulnerabilities.txt"; echo '```'
            } > "${body}"
            if [[ -n "${open}" ]]; then
              gh issue edit "${open}" --body-file "${body}"
            else
              gh issue create --title "${VULNERABLE_TITLE}" --body-file "${body}" \
                ${NOTIFY:+--assignee "${NOTIFY}"}
            fi
          elif [[ -n "${open}" ]]; then
            gh issue close "${open}" --comment "govulncheck finds nothing the pinned engine reaches."
          fi

      - name: Rewrite the pins
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VULNERABLE: ${{ needs.vulnerabilities.outputs.vulnerable }}
        run: |
          set -euo pipefail
          security=()
          if [[ "${VULNERABLE}" == true ]]; then
            security=(--security-only)
          fi
          python3 tools/upstream-watch check --source . --apply "${security[@]}" \
            --report "${RUNNER_TEMP}/proposal.json"

      - name: Report the major updates, or close the report
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NOTIFY: ${{ vars.UPSTREAM_WATCH_NOTIFY }}
        run: |
          set -euo pipefail
          proposal="${RUNNER_TEMP}/proposal.json"
          open=$(gh issue list --state open --search "in:title \"${MAJOR_TITLE}\"" \
            --json number,title --jq "map(select(.title == env.MAJOR_TITLE))[0].number // empty")
          if [[ "$(jq '.held | length' "${proposal}")" -gt 0 ]]; then
            body="${RUNNER_TEMP}/body.md"
            { echo "Never merged by the watch: each needs a decision on what changed."
              echo; echo "| Component | Pinned | Upstream | Released |"; echo "|---|---|---|---|"
              jq -r '.held[] | "| \(.component) | \(.current) | \(.proposed) | \(.released_at) |"' "${proposal}"
            } > "${body}"
            if [[ -n "${open}" ]]; then
              gh issue edit "${open}" --body-file "${body}"
            else
              gh issue create --title "${MAJOR_TITLE}" --body-file "${body}" \
                ${NOTIFY:+--assignee "${NOTIFY}"}
            fi
          elif [[ -n "${open}" ]]; then
            gh issue close "${open}" --comment "No major upstream update is waiting."
          fi

      # One branch, one pull request: what is newer today, on top of main. It
      # is pushed only when its tree differs from what the branch holds, so the
      # checks on it run again only when there is something new to check.
      - name: Keep the proposal's pull request
        id: proposal
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NOTIFY: ${{ vars.UPSTREAM_WATCH_NOTIFY }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          proposal="${RUNNER_TEMP}/proposal.json"
          open=$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
          if git diff --quiet; then
            if [[ -n "${open}" ]]; then
              gh pr close "${open}" --delete-branch --comment "Nothing upstream is newer than main."
            fi
            exit 0
          fi
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git -c user.name="${APP_SLUG}[bot]" \
              -c user.email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
              commit --quiet --all --message "Update the WAF packages' upstream pins"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          remote="https://github.com/${REPOSITORY}.git"
          if git -c http.extraheader="${auth}" fetch --quiet "${remote}" "${BRANCH}" 2>/dev/null \
              && [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo "the branch already holds this proposal"
            echo "unchanged=true" >> "${GITHUB_OUTPUT}"
          else
            git -c http.extraheader="${auth}" push --quiet --force "${remote}" "HEAD:refs/heads/${BRANCH}"
          fi
          body="${RUNNER_TEMP}/pr.md"
          { echo "Proposed by the upstream watch (B323). Merged by itself once every check passed"
            echo "and each upstream release is two days old, within the hour (upstream-merge.yml)."
            echo "Label \`hold\` to stop it, \`no-cooldown\` to merge it once green."
            echo; echo "| Component | Pinned | Proposed | Class | Released |"; echo "|---|---|---|---|---|"
            jq -r '.proposed[] | "| \(.component) | \(.current) | \(.proposed) | \(.kind) | \(.released_at) |"' "${proposal}"
          } > "${body}"
          if [[ -n "${open}" ]]; then
            gh pr edit "${open}" --body-file "${body}"
          else
            gh pr create --head "${BRANCH}" --base main \
              --title "Update the WAF packages' upstream pins" --body-file "${body}" \
              ${NOTIFY:+--assignee "${NOTIFY}"}
          fi

      # An unchanged branch gets no new checks, so a failure from outside - a
      # mirror that answered 503 (26-10-21) - would hold the proposal for good.
      # Its failed jobs run again once a night; a real failure fails again and
      # stays in view.
      - name: Run the proposal's failed checks again
        if: steps.proposal.outputs.unchanged == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/${REPOSITORY}/branches/${BRANCH}" --jq .commit.sha)
          for run in $(gh api "repos/${REPOSITORY}/actions/runs?head_sha=${head}&status=failure" \
              --jq '.workflow_runs[].id'); do
            echo "running the failed jobs of ${run} again"
            gh api --method POST "repos/${REPOSITORY}/actions/runs/${run}/rerun-failed-jobs"
          done

  locks:
    name: Propose the locked dependencies' security fixes
    if: github.repository == 'haprion/haprion'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment: upstream-watch
    permissions:
      contents: read
      actions: write # run a proposal's failed checks again

    steps:
      - name: Act as the app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.UPSTREAM_WATCH_CLIENT_ID }}
          private-key: ${{ secrets.UPSTREAM_WATCH_PRIVATE_KEY }}
          permission-contents: write # the proposal's branch
          permission-pull-requests: write # its pull request
          permission-issues: write # an advisory no upgrade clears

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The uv the gate audits with; no cache in a job that writes.
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.12.5"
          enable-cache: false

      - name: Upgrade what an advisory names a fix for
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/upstream-watch locks --source . --apply --report "${RUNNER_TEMP}/locks.json"

      - name: Report an advisory no upgrade clears, or close the report
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NOTIFY: ${{ vars.UPSTREAM_WATCH_NOTIFY }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/locks.json"
          open=$(gh issue list --state open --search "in:title \"${HELD_TITLE}\"" \
            --json number,title --jq "map(select(.title == env.HELD_TITLE))[0].number // empty")
          if [[ "$(jq '.held | length' "${report}")" -gt 0 ]]; then
            body="${RUNNER_TEMP}/held.md"
            { echo "The lock keeps these after an upgrade: no fixed version yet, or one the project's"
              echo "own constraints keep out. The gate fails on them until the lock moves."
              echo; echo "| Lock | Package | Locked | Advisory | Fixed in |"; echo "|---|---|---|---|---|"
              jq -r '.held[] | "| \(.project)/uv.lock | \(.package) | \(.version) | \(.advisory) | \(.fixed | join(", ")) |"' "${report}"
            } > "${body}"
            if [[ -n "${open}" ]]; then
              gh issue edit "${open}" --body-file "${body}"
            else
              gh issue create --title "${HELD_TITLE}" --body-file "${body}" \
                ${NOTIFY:+--assignee "${NOTIFY}"}
            fi
          elif [[ -n "${open}" ]]; then
            gh issue close "${open}" --comment "Every advisory in the locks is cleared."
          fi

      - name: Keep the proposal's pull request
        id: proposal
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          NOTIFY: ${{ vars.UPSTREAM_WATCH_NOTIFY }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          report="${RUNNER_TEMP}/locks.json"
          open=$(gh pr list --head "${LOCKS_BRANCH}" --state open --json number --jq '.[0].number // empty')
          if git diff --quiet; then
            if [[ -n "${open}" ]]; then
              gh pr close "${open}" --delete-branch --comment "No lock on main has an advisory an upgrade clears."
            fi
            exit 0
          fi
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git -c user.name="${APP_SLUG}[bot]" \
              -c user.email="${user_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
              commit --quiet --all --message "Update the locked dependencies with known vulnerabilities"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          remote="https://github.com/${REPOSITORY}.git"
          if git -c http.extraheader="${auth}" fetch --quiet "${remote}" "${LOCKS_BRANCH}" 2>/dev/null \
              && [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$(git rev-parse 'HEAD^{tree}')" ]]; then
            echo "the branch already holds this proposal"
            echo "unchanged=true" >> "${GITHUB_OUTPUT}"
          else
            git -c http.extraheader="${auth}" push --quiet --force "${remote}" "HEAD:refs/heads/${LOCKS_BRANCH}"
          fi
          body="${RUNNER_TEMP}/pr.md"
          { echo "Proposed by the upstream watch (B353): each package a known advisory names a fix"
            echo "for, upgraded in its lock. Merged by itself once every check passed, with no wait."
            echo "Label \`hold\` to stop it."
            echo; echo "| Lock | Package | Was | Now | Advisory |"; echo "|---|---|---|---|---|"
            jq -r '.updated[] | "| \(.project)/uv.lock | \(.package) | \(.version) | \(.locked | join(", ")) | \(.advisory) |"' "${report}"
          } > "${body}"
          if [[ -n "${open}" ]]; then
            gh pr edit "${open}" --body-file "${body}"
          else
            gh pr create --head "${LOCKS_BRANCH}" --base main \
              --title "Update the locked dependencies with known vulnerabilities" --body-file "${body}" \
              ${NOTIFY:+--assignee "${NOTIFY}"}
          fi

      - name: Run the proposal's failed checks again
        if: steps.proposal.outputs.unchanged == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/${REPOSITORY}/branches/${LOCKS_BRANCH}" --jq .commit.sha)
          for run in $(gh api "repos/${REPOSITORY}/actions/runs?head_sha=${head}&status=failure" \
              --jq '.workflow_runs[].id'); do
            echo "running the failed jobs of ${run} again"
            gh api --method POST "repos/${REPOSITORY}/actions/runs/${run}/rerun-failed-jobs"
          done
