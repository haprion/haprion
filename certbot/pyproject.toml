#
# The certbot environment: certbot itself and every DNS plugin the product
# offers, resolved together and locked with hashes in uv.lock. The catalogue
# the web interface shows is a subset of this file, never a superset - a plugin
# that is not here cannot be chosen, and nothing installs anything at runtime.
#
# Built into an immutable release by tools/install-certbot-env.py. Bumped a few
# times a year, in staging, with `certbot renew --dry-run --run-deploy-hooks`
# as the gate; see docs/user-manual.md, 'The certbot environment'.
#
# Two tiers, and the order below is that grouping. `core` is certbot's own
# plugins, pinned to the same version as certbot because they are released
# together. `community` is third-party packages from PyPI with their own
# release cadence - the range operator (~=) lets a lock refresh pick up their
# patch releases; the lock file is what pins.
#
[project]
name = "haprion-certbot-env"
version = "0"
description = "certbot and its DNS plugins for Haprion, locked as one set"
requires-python = ">=3.12"
dependencies = [
    # core - certbot and its own plugins, one version
    "certbot==5.8.0",
    "certbot-dns-cloudflare==5.8.0",
    "certbot-dns-digitalocean==5.8.0",
    "certbot-dns-dnsimple==5.8.0",
    "certbot-dns-dnsmadeeasy==5.8.0",
    "certbot-dns-google==5.8.0",
    "certbot-dns-linode==5.8.0",
