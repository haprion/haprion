<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4493f8"/></marker></defs><rect x="16" y="101" width="96" height="38" rx="19" fill="#0d1117" stroke="#6e7681" stroke-width="1.5"/><text x="64" y="125" font-size="14" font-weight="600" fill="#e6edf3" text-anchor="middle">Clients</text><path d="M112,120 L150,120" fill="none" stroke="#6e7681" stroke-width="1.5" marker-end="url(#head)"/><path d="M166,96 L238,96 L254,120 L238,144 L166,144 L150,120 z" fill="#0c2d6b" stroke="#4493f8" stroke-width="1.5"/><text x="202" y="118" font-size="14" font-weight="700" fill="#4493f8" text-anchor="middle">VIP</text><text x="202" y="135" font-size="11.5" font-weight="400" fill="#9198a1" text-anchor="middle">keepalived</text><rect x="300" y="28" width="300" height="230" rx="12" fill="#151b23" stroke="#3d444d" stroke-width="1.5"/><text x="318" y="52" font-size="13" font-weight="600" fill="#9198a1" text-anchor="start">HAProxy cluster</text><rect x="324" y="66" width="252" height="62" rx="8" fill="#0d1117" stroke="#4493f8" stroke-width="2"/><text x="450" y="92" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">node-a</text><text x="450" y="112" font-size="12.5" font-weight="400" fill="#9198a1" text-anchor="middle">HAProxy and WAF · holds the VIP</text><rect x="324" y="168" width="252" height="62" rx="8" fill="#0d1117" stroke="#6e7681" stroke-width="1.5" stroke-dasharray="5 4"/><text x="450" y="194" font-size="15" font-weight="700" fill="#e6edf3" text-anchor="middle">node-b</text><text x="450" y="214" font-