schema_version: 1
clusters:
  alpha:
    display_name: Alpha
    #
    # The address whose ownership deploy checks. One node holds every virtual
    # address at a time, so this one answers for all of them.
    #
    vip: 192.0.2.20
    #
    # The addresses generated frontends bind, and the address each one connects
    # to backends from - a SNIP, in ADC vocabulary. Optional: a cluster with a
    # single address and no separate source can leave the whole section out and
    # gets one VIP named `main` from the line above.
    #
    vips:
      internal:
        address: 192.0.2.20
        source: 192.0.2.25
      dmz:
        address: 198.51.100.20
        source: 198.51.100.25
    default_vip: internal
    config_path: /srv/haproxy-manager/config-repositories/alpha
    publish_path: /srv/haproxy-manager/published/alpha
    node_path: alpha
    validation_certs: /srv/haproxy-manager/validation-certs
    default_certificate: example.com
    certificate_ids:
      - example.com
      - example.net
    trusted_proxy_cidrs:
      - 198.51.100.0/24
    nodes:
      - name: node-a
        mgmt_host: node-a.example.com
      - name: node-b
        mgmt_host: node-b.example.com
