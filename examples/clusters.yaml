schema_version: 1
clusters:
  alpha:
    display_name: Alpha
    #
    # The address whose ownership deploy checks. One node holds every virtual
    # address at a time, so this one answers for all of them.
    #
    vip: 192.0.2.20
    #
    # The addresses generated frontends bind, and the address each one connects
    # to backends from - what an ADC calls a SNIP. Optional: a cluster with a
    # single address and no separate source can leave the whole section out and
    # gets one VIP named `main` from the line above.
    #
    vips:
      internal:
        address: 192.0.2.20
        source: 192.0.2.25
        #
        # Which TLS versions and ciphers this listener accepts: `intermediate`
        # for TLS 1.2 and 1.3, `modern` for 1.3 alone. Optional, and left out
        # the listener takes what `core/` sets. Read that file before naming a
        # policy here - a bind line overrides those defaults in both
        # directions.
        #
        tls: intermediate
      dmz:
        address: 198.51.100.20
        source: 198.51.100.25
    default_vip: internal
    #
    # Named source addresses an object may connect out from instead of the one
    # its VIP pairs with. HAProxy takes the source per backend, so the pairing
    # above is a default rather than a rule; this table is for the exception.
    #
    sources:
      outbound: 192.0.2.35
    #
    # The resolvers section in core/ that generated server lines point at, so a
    # backend named by hostname is looked up again when its address changes
    # rather than once at startup. Optional; without it, hostnames are resolved
    # exactly once per reload.
    #
    resolvers: cluster-dns
    #
    # Named address groups an object may restrict itself to with `allow_from`.
    # The object names the group; which addresses that is stays here, so the
    # same object means the same thing in a rehearsal cluster and in production.
    #
    networks:
      office:
        - 198.51.100.0/24
      vpn:
        - 203.0.113.0/24
    #
    # What a request for a hostname no object claims is answered with. Without
    # it HAProxy answers 503, which is a defensible outcome but not a chosen
    # one. Set exactly one of status or redirect.
    #
    unknown_host:
      status: 404
    config_path: /srv/haproxy-manager/config-repositories/alpha
    publish_path: /srv/haproxy-manager/published/alpha
    node_path: alpha
    validation_certs: /srv/haproxy-manager/validation-certs
    default_certificate: example.com
    certificate_ids:
      - example.com
      - example.net
    #
    # Whose forwarded headers are believed. Every generated frontend deletes
    # X-Forwarded-For, -Proto and -Host and writes its own, because they are
    # ordinary request headers and a visitor can claim to be anybody. A request
    # arriving from one of these addresses is the exception: it comes from a
    # machine that has already established those facts, so its chain is
    # extended rather than thrown away. Leave the list empty where HAProxy is
    # the first thing traffic reaches.
    #
    #
    # A brake on one source address that is plainly not a visitor. Counted per
    # address over `window`; a request rate above `max_requests` or an error
    # rate above `max_errors` is refused with 429 until the rate falls again.
    #
    # A brake and not a ban list on purpose: HAProxy keeps these counters in
    # the process, so a reload - and a publish reloads - starts them empty. A
    # ban measured in hours would quietly last until the next edit.
    #
    # Skipped for `trusted_proxy_cidrs`, since behind a front-line proxy every
    # request carries its address and the rule would refuse everybody.
    #
    # Optional; leave it out and nothing is generated.
    #
    abuse_protection:
      window: 10s
      max_requests: 100
      max_errors: 20
    trusted_proxy_cidrs:
      - 198.51.100.0/24
    nodes:
      - name: node-a
        mgmt_host: node-a.example.com
      - name: node-b
        mgmt_host: node-b.example.com
