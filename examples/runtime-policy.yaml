schema_version: 1
cluster_file: /srv/haproxy-manager/config/clusters.yaml
config_root: /srv/haproxy-manager/config-repositories
publish_root: /srv/haproxy-manager/published
validation_certs_root: /srv/haproxy-manager/validation-certs

# Who the manager becomes to reach a node, and with which key. Optional: only
# the deploy path uses it, and every other command works without it.
deploy_identity:
  user: svc-app
  key: /root/.ssh/id_ed25519_example_deploy

# The certificate registry (see certificates.yaml). Optional: without it a
# cluster's certificates are the `certificate_ids` list in clusters.yaml. Once
# named, that list must have moved here.
# certificate_registry: /srv/haproxy-manager/config/certificates.yaml

# How haproxy-cert-issue answers ACME challenges. Each method needs one
# installation-specific path that the caller must never supply: the
# credential file for DNS-01, the webroot for HTTP-01. Leave a method out and
# issuing with it is refused by name.
# acme:
#   dns_cloudflare_credentials: /etc/letsencrypt/cloudflare/example.ini
#   webroot: /var/www/acme
