schema_version: 1
cluster_file: /srv/haproxy-manager/config/clusters.yaml
config_root: /srv/haproxy-manager/config-repositories
publish_root: /srv/haproxy-manager/published
validation_certs_root: /srv/haproxy-manager/validation-certs

# Who the manager becomes to reach a node, and with which key. Optional: only
# the deploy path uses it, and every other command works without it.
deploy_identity:
  user: svc-app
  key: /root/.ssh/id_ed25519_example_deploy

# Root-only node DR archives. The backup identity reaches only the node's
# argumentless state-export forced command and is separate from deploy/status.
backup_root: /srv/state-backups
backup_identity:
  user: svc-backup
  key: /root/.ssh/id_ed25519_node_backup

# The certificate registry (see certificates.yaml). Optional: without it a
# cluster's certificates are the `certificate_ids` list in clusters.yaml. Once
# named, that list must have moved here.
# certificate_registry: /srv/haproxy-manager/config/certificates.yaml

# Where haprion-cert-receiver puts a new receiver's directory (<root>/<id>)
# unless --path says otherwise, and where it keeps a migration's record. The
# registry, not this root, says where each receiver actually is; one made
# before the command existed may live elsewhere. Optional until the first
# receiver is registered; `add` and `migrate` refuse without it.
# receiver_root: /srv/haproxy-manager/receivers

# How haprion-cert-issue answers ACME challenges. Each method needs one
# installation-specific path that the caller must never supply: the
# credential file for DNS-01, the webroot for HTTP-01. Leave a method out and
# issuing with it is refused by name.
# acme:
#   dns_cloudflare_credentials: /etc/letsencrypt/cloudflare/example.ini
#   webroot: /var/www/acme

# The web interface's worker account. A version it publishes records the
# signed-in person it names as who published it; any other caller of a helper
# is recorded as the account sudo proves, whatever its request says. Leave it
# out and every version names the account that ran the helper.
# interface_account: svc-app
