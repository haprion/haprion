# Haprion's accounts on each node (B266). Names are fixed; see
# src/haprion/accounts.py.
#
# Each account is reached by one key of the manager's, with `restrict` and a
# forced command, and sshd runs a forced command through the login shell - so
# they have a real one. What constrains them is the key line, not the shell.
# The home directories, root-owned, are made by the installation.

u _haprion-trigger - "Haprion - configuration, certificates and server state" /home/_haprion-trigger /bin/bash
u _haprion-status - "Haprion - node status" /home/_haprion-status /bin/bash
u _haprion-backup - "Haprion - state export" /home/_haprion-backup /bin/bash
u _haprion-logread - "Haprion - traffic log reader" /home/_haprion-logread /bin/bash

# The traffic log's group: rsyslog writes into it, the reader reads.
g _haprion-logs -
m _haprion-logread _haprion-logs

# Member-less groups the WAF engine and dnsdist are given in their drop-ins, so
# each may pass through the release directory and nothing else may.
g _haprion-waf -
g _haprion-dns -
