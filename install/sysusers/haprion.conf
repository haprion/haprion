# Haprion's accounts on the management host (B266). Names are fixed; see
# src/haproxy_mgmt/accounts.py.
#
# "u", not "u!": both set an invalid password, but "u!" also marks the account
# expired, and PAM's account stage then rejects it - the service accounts must
# pass it to reach their exact root helpers through sudo.
#
# The pull accounts are reached by the nodes over SSH, each key with a forced
# rrsync command, and sshd runs a forced command through the login shell - so
# they have a real one. The home directories are made by the installation.

g haprion -
g _haprion-ui -

u _haprion-pull - "Haprion - nodes fetch published releases" /home/_haprion-pull /bin/bash
u _haprion-cert-pull - "Haprion - nodes fetch certificates" /home/_haprion-cert-pull /bin/bash

u _haprion-web - "Haprion web service" - /usr/sbin/nologin
u _haprion-worker - "Haprion worker service" - /usr/sbin/nologin
u _haprion-poller - "Haprion poller service" - /usr/sbin/nologin
u _haprion-collector - "Haprion traffic log collector" - /usr/sbin/nologin
u _haprion-oidc - "Haprion OIDC helper" - /usr/sbin/nologin

m _haprion-worker haprion
m _haprion-web _haprion-ui
m _haprion-worker _haprion-ui
m _haprion-poller _haprion-ui
