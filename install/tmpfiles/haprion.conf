# The cluster lock's directory and the helpers' sockets, recreated at every boot.
#
# /run is tmpfs and is cleared on boot, which is deliberate: a lock must never
# outlive the process that could have held it. The lock file and the `locks`
# subdirectory are created on demand by the root helper that takes the lock, so
# nothing needs to survive - but the parent must *exist* before that, because
# haprion-worker.service names it in ReadWritePaths and systemd sets up the
# unit's mount namespace before any helper has run. Without this file the worker
# fails at step NAMESPACE on every boot and restarts forever.
#
# root:root 0755: only root takes the lock, and the worker reaches it through
# sudo, not as itself.

d /run/haprion 0755 root root -
#
# The block clients' account's home (B412): root's, so that sshd's StrictModes
# accepts the key file the client helper renders into it.
#
d /etc/haprion/block-clients 0755 root root -
d /etc/haprion/block-clients/.ssh 0755 root root -
