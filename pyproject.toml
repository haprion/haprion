#
# The marker that says this package is typed. Without it a consumer - the web
# interface, which type-checks strictly - silently loses every type this engine
# declares and mypy reports the import as untyped. The types are already here;
# this is what makes them visible.
#
[tool.setuptools.package-data]
haprion = ["py.typed", "compatibility.json", "dns-providers.yaml", "apt-keys/*.asc"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "SIM", "EXE"]

[tool.ruff.lint.per-file-ignores]
"contract-tests/**/*.py" = ["S101"]
"tests/**/*.py" = ["S101", "S108", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tools", "tests"]
#
# The tests import each other as `tests.<module>`, and the package lives under
# src/. Without both bases a test file is found twice under two names.
#
mypy_path = ["src", "."]
explicit_package_bases = true

[tool.coverage.run]
branch = true
source = ["haprion"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
