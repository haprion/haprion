haproxy-network-publish-helper = "haproxy_mgmt.cli.managed_network_publish:main"
haproxy-cluster-settings = "haproxy_mgmt.cli.cluster_settings:main"
haproxy-cluster-settings-helper = "haproxy_mgmt.cli.cluster_settings_helper:main"
haproxy-cluster-settings-publish-helper = "haproxy_mgmt.cli.cluster_settings_publish:main"
haproxy-objects-publish-helper = "haproxy_mgmt.cli.managed_objects_publish:main"
haproxy-ui-traffic-collector = "haproxy_mgmt.traffic_collector:_entry"

#
# The marker that says this package is typed. Without it a consumer - the web
# interface, which type-checks strictly - silently loses every type this engine
# declares and mypy reports the import as untyped. The types are already here;
# this is what makes them visible.
#
[tool.setuptools.package-data]
haproxy_mgmt = ["py.typed", "compatibility.json", "dns-providers.yaml", "apt-keys/*.asc"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "SIM", "EXE"]

[tool.ruff.lint.per-file-ignores]
"contract-tests/**/*.py" = ["S101"]
"tests/**/*.py" = ["S101", "S108", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tools"]

[tool.coverage.run]
branch = true
source = ["haproxy_mgmt"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
