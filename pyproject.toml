[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haproxy-manager"
version = "0.1.0"
description = "UI-independent HAProxy management engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6,<7"]

[dependency-groups]
dev = [
    "build==1.5.0",
    "coverage==7.15.4",
    "jsonschema>=4.23,<5",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "referencing>=0.35,<1",
    "ruff==0.16.4",
    "types-PyYAML==6.0.12.20260815",
    "zizmor==1.29.0",
]

[project.scripts]
haproxy-cluster-config = "haproxy_mgmt.cli.cluster_config:main"
haproxy-render-sysusers = "haproxy_mgmt.cli.render_sysusers:main"
haproxy-validate-candidate-helper = "haproxy_mgmt.cli.validate_candidate_helper:main"
haproxy-history-reset = "haproxy_mgmt.cli.history_reset:main"
haproxy-history-reset-helper = "haproxy_mgmt.cli.history_reset_helper:main"
haproxy-publish = "haproxy_mgmt.cli.publish:main"
haproxy-publish-helper = "haproxy_mgmt.cli.publish_helper:main"
haproxy-revert = "haproxy_mgmt.cli.revert:main"
haproxy-revert-helper = "haproxy_mgmt.cli.revert_helper:main"
haproxy-list = "haproxy_mgmt.cli.list:main"
haproxy-list-helper = "haproxy_mgmt.cli.list_helper:main"
haproxy-config-status = "haproxy_mgmt.cli.config_status:main"
haproxy-status = "haproxy_mgmt.cli.status:main"
haproxy-status-helper = "haproxy_mgmt.cli.status_helper:main"
haproxy-probe = "haproxy_mgmt.cli.probe:main"
haproxy-probe-helper = "haproxy_mgmt.cli.probe_helper:main"
haproxy-inventory = "haproxy_mgmt.cli.inventory:main"
haproxy-list-backups = "haproxy_mgmt.cli.list_backups:main"
haproxy-list-backups-helper = "haproxy_mgmt.cli.list_backups_helper:main"
haproxy-inventory-helper = "haproxy_mgmt.cli.inventory_helper:main"
haproxy-objects = "haproxy_mgmt.cli.objects:main"
haproxy-objects-helper = "haproxy_mgmt.cli.objects_helper:main"
haproxy-deploy = "haproxy_mgmt.cli.deploy:main"
haproxy-deploy-helper = "haproxy_mgmt.cli.deploy_helper:main"
haproxy-cert-list = "haproxy_mgmt.cli.cert_list:main"
haproxy-cert-list-helper = "haproxy_mgmt.cli.cert_list_helper:main"
haproxy-cert-deploy = "haproxy_mgmt.cli.cert_deploy:main"
haproxy-cert-deploy-helper = "haproxy_mgmt.cli.cert_deploy_helper:main"
haproxy-network = "haproxy_mgmt.cli.network:main"
haproxy-network-helper = "haproxy_mgmt.cli.network_helper:main"
haproxy-network-publish-helper = "haproxy_mgmt.cli.managed_network_publish:main"
haproxy-objects-publish-helper = "haproxy_mgmt.cli.managed_objects_publish:main"

#
# The marker that says this package is typed. Without it a consumer - the web
# interface, which type-checks strictly - silently loses every type this engine
# declares and mypy reports the import as untyped. The types are already here;
# this is what makes them visible.
#
[tool.setuptools.package-data]
haproxy_mgmt = ["py.typed", "compatibility.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "S", "SIM", "EXE"]

[tool.ruff.lint.per-file-ignores]
"contract-tests/**/*.py" = ["S101"]
"tests/**/*.py" = ["S101", "S108", "S603"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tools"]

[tool.coverage.run]
branch = true
source = ["haproxy_mgmt"]

[tool.coverage.report]
fail_under = 75
show_missing = true
skip_covered = true
