haproxy-cert-receiver = "haproxy_mgmt.cli.cert_receiver:main"
haproxy-cert-issue-helper = "haproxy_mgmt.cli.cert_issue_helper:main"
haproxy-cert-publish-helper = "haproxy_mgmt.cli.cert_publish_helper:main"
haproxy-cert-target-helper = "haproxy_mgmt.cli.cert_target_helper:main"
haproxy-cert-receiver-helper = "haproxy_mgmt.cli.cert_receiver_helper:main"
haproxy-cert-receiver-ask = "haproxy_mgmt.cli.cert_receiver_ask:main"
haproxy-ui-tls-helper = "haproxy_mgmt.cli.ui_tls_helper:main"
haproxy-oidc-helper = "haproxy_mgmt.cli.oidc_helper:main"
haproxy-ndes-profile-apply-helper = "haproxy_mgmt.cli.ndes_profile_apply_helper:main"
