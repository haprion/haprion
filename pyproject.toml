[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haprion"
version = "0.8.0"
description = "UI-independent HAProxy management engine"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = ["PyNaCl>=1.5,<2", "PyYAML>=6,<7", "psycopg>=3.3,<4", "PyJWT[crypto]>=2.10,<3"]

[dependency-groups]
dev = [
    "build==1.5.0",
    "coverage==7.15.4",
    "jsonschema>=4.23,<5",
    "mypy==2.3.1",
    "pip-audit==2.10.1",
    "referencing>=0.35,<1",
    "ruff==0.16.4",
    "types-jsonschema==4.26.0.20260518",
    "types-PyYAML==6.0.12.20260815",
    "zizmor==1.29.0",
]

[project.scripts]
haprion-cluster-config = "haprion.cli.cluster_config:main"
