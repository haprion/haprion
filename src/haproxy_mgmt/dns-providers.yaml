  documentation: https://pypi.org/project/certbot-dns-zoneedit/
  propagation_seconds: 120
  verification: loaded
  fields:
  - id: user
    label: Username
    kind: text
    required: true
    secret: false
    key: dns_zoneedit_user
  - id: token
    label: API token
    kind: text
    required: true
    secret: true
    key: dns_zoneedit_token
not_offered:
- package: certbot-dns-acmedns
  reason: needs a per-domain registration JSON file beside the INI file, not a set of values
- package: certbot-dns-multi
  reason: a meta-plugin whose INI keys are free-form lego environment names; the contract forbids form
    values becoming keys
- package: certbot-dns-transip
  reason: authenticates with an RSA private key file, which this contract does not carry through the form
