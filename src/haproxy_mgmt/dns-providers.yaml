# The DNS providers the product offers for Let's Encrypt DNS-01, one entry per
# locked certbot plugin. Read by haproxy_mgmt.dns_provider_catalog, which
# refuses anything outside the shape it documents.
#
# Every entry was measured against the installed plugin, not its README: INI
# keys, defaults and delivery come from the plugin's own credential setup.
# Values in `fields` are what the form asks for; `key` is the INI key the
# adapter writes. A field marked `secret` is scrubbed from certbot's output.
# `delivery` is how the root helper hands certbot the rendered file.
# `propagation_seconds` starts at the plugin's own default and is raised where
# a real zone proved the default short: Cloudflare's 10 failed one renewal in
# five on a live zone and 30 renewed all of them, so 30 is what every Cloudflare
# lineage is issued with.
# `verification` states the evidence: packaged (in the lock), loaded (the
# entrypoint loads and the rendered file passes the plugin's own credential
# validation), integration-tested (plugin and SDK exercised with a mocked
# network), live-verified (a real issuance).
#
# `not_offered` lists locked plugins this contract cannot describe, with the
# reason, so a lock refresh cannot add or drop a provider unnoticed.
schema_version: 1
providers:
- id: active24
  name: Active24
  tier: community
  package: certbot-dns-active24
  plugin: dns-active24
  adapter: ini
  delivery: flag:credentials
  documentation: https://pypi.org/project/certbot-dns-active24/
  propagation_seconds: 300
  verification: loaded
  fields:
  - id: api_key
    label: API key
    kind: text
    required: true
    secret: true
    key: dns_active24_api_key
  - id: secret
