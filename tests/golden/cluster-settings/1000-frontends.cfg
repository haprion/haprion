log-profile mgd-traffic-json-external
    log-tag "haproxy-traffic"
    on error drop
    on close format "%{+json}o %(schema)[int(1)] %(node)H %(at)Ts %(request)rt %(client)ci %(method)HM %(host)[var(txn.traffic_host)] %(path)HPO %(frontend)f %(backend)b %(server)s %(status)ST %(request_time)TR %(queue_time)Tw %(connect_time)Tc %(response_time)Tr %(total_time)Ta %(bytes)B %(rule)[var(txn.rule)] %(waf_rules)[var(txn.coraza.rule_ids),bytes(0,1024)] %(waf_score)[var(txn.coraza.anomaly_score)] %(waf_id)[var(txn.coraza.id),bytes(0,96)]"

frontend mgd-main-http
    guid fe:main-http.c3c0f574fe011a95
    bind 192.0.2.20:80 guid-prefix li:main-http.c2161b91f471ab11
    mode http
    option httplog
    log ring@mgd-log-graylog len 2048 format rfc5424 profile mgd-traffic-json-external local2
    log ring@mgd-log-loki len 2048 format rfc5424 profile mgd-traffic-json-external local2
    http-request set-var(txn.traffic_host) req.hdr(host),cut_crlf,bytes(0,253)
    timeout client 50s
    acl mgd-trusted-proxy src 198.51.100.0/24
    http-request del-header X-Forwarded-For unless mgd-trusted-proxy
    http-request del-header X-Forwarded-Proto unless mgd-trusted-proxy
    http-request del-header X-Forwarded-Host unless mgd-trusted-proxy
    http-request set-header X-Forwarded-Proto http unless mgd-trusted-proxy
    http-request set-header X-Forwarded-Host %[req.hdr(host),field(1,:),lower] unless mgd-trusted-proxy
    stick-table type ip size 1m expire 10s store http_req_rate(10s),http_err_rate(10s)
    http-request track-sc0 req.hdr_ip(X-Forwarded-For,-1) if mgd-trusted-proxy
    http-request track-sc0 src unless mgd-trusted-proxy
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
    http-request deny deny_status 429 if { sc_http_err_rate(0) gt 20 }

    # shop
    acl mgd-shop-host req.hdr(host),field(1,:),lower -m str shop.example.com
    use_backend mgd-shop-web if mgd-shop-host
    default_backend mgd-main-http-unknown

backend mgd-main-http-unknown
    mode http
    http-request return status 404 content-type text/plain string "No site is configured for this name."
