schema: 1
name: admin
hostnames: [admin.example.net]
listen:
  protocol: https
  certificate: example.net
allow_from: [office, 203.0.113.128/25]
headers:
  request:
    set:
      X-Tenant: '100% admin'
    delete: [X-Debug]
  response:
    set:
      X-Frame-Options: DENY
    delete: [Server]
routes:
  - path: /
    backend: console
backends:
  console:
    balance: leastconn
    cookie: MGDSRV
    health:
      type: http
      tls: true
      port: 9443
      path: /healthz
    tls:
      verify: system
    servers:
      - host: admin-a.example.net
        port: 8443
        weight: 20
      - host: standby.example.net
        port: 8443
        backup: true
