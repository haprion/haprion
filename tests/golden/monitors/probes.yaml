schema: 1
name: probes
hostnames: [probes.example.com]
listen:
  protocol: http
routes:
  - path: /
    backend: plain-tcp
  - path: /tls-handshake
    backend: tls-tcp
  - path: /tcp-content
    backend: tcp-content
  - path: /http
    backend: http-plain
  - path: /http-content
    backend: http-content
  - path: /https
    backend: https-content
  - path: /https-on-a-plain-pool
    backend: https-check
  - path: /plain-on-a-tls-pool
    backend: plain-check
backends:
  plain-tcp:
    balance: roundrobin
    max_connections: 50
    slow_start: 30s
    health:
      type: tcp
    servers:
      - host: 198.51.100.10
        port: 8080
  tls-tcp:
    balance: roundrobin
    health:
      type: tcp
      tls: true
      interval: 30s
    servers:
      - host: probe-a.example.net
        port: 8443
  tcp-content:
    balance: roundrobin
    health:
      type: tcp
      send: PING
      expect: PONG
      interval: 5s
      fast_interval: 1s
      down_interval: 10s
      rise: 3
      fall: 2
    servers:
      - host: 198.51.100.12
        port: 6379
  http-plain:
    balance: roundrobin
    health:
      type: http
      path: /healthz
    servers:
      - host: 198.51.100.13
        port: 8080
  http-content:
    balance: roundrobin
    health:
      type: http
      path: /healthz
      host: app.example.com
      expect_status: 200-299
      expect_body: ready
    servers:
      - host: 198.51.100.14
        port: 8080
  https-content:
    balance: roundrobin
    health:
      type: http
      tls: true
      path: /healthz
      host: app.example.com
      expect_status: "200"
    tls:
      verify: system
    servers:
      - host: content-a.example.net
        port: 8443
  https-check:
    balance: roundrobin
    health:
      type: http
      tls: true
      path: /healthz
      port: 9443
    servers:
      - host: 198.51.100.15
        port: 8080
  plain-check:
    balance: roundrobin
    health:
      type: http
      tls: false
      path: /healthz
      port: 8080
    tls:
      verify: none
    servers:
      - host: 198.51.100.16
        port: 8443
