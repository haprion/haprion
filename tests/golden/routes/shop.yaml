schema: 1
name: shop
hostnames: [shop.example.com, www.example.com]
listen:
  protocol: http
rate_limit:
  window: 10s
  max_requests: 100
routes:
  - path: /
    backend: web
  - path: /api
    backend: api
    strip_prefix: /api
    add_prefix: /v2
  - path: /api/v1/orders
    backend: orders
  - path: /health
    match: exact
    backend: web
  - path: /c++
    backend: legacy
    strip_prefix: /c++
    add_prefix: /a%20b
  - path: /shop
    redirect:
      location: https://example.net/store
      status: 308
backends:
  web:
    balance: roundrobin
    health:
      type: disabled
    servers:
      - host: 198.51.100.10
        port: 8080
      - host: 198.51.100.11
        port: 8080
  api:
    balance: hdr
    balance_key: X-Tenant
    health:
      type: http
      path: /healthz
    servers:
      - host: 198.51.100.20
        port: 9000
  legacy:
    balance: roundrobin
    health:
      type: tcp
    servers:
      - host: 198.51.100.40
        port: 8080
  orders:
    balance: roundrobin
    health:
      type: tcp
    servers:
      - host: 198.51.100.30
        port: 9100
