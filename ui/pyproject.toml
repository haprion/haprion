[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haprion-ui"
version = "0.99.3"
description = "Web interface for the HAProxy management engine"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"

#
# A separate distribution from haprion, in the same repository. The CLI
# is the authoritative engine and is installed under /opt as the recovery path;
# it must not carry web code it never runs, and the two are rolled back
# independently.
#
# haprion is a dependency rather than a copy: the interface reads the
# same result envelopes, through the same parsing code, as the command line.
#
dependencies = [
    "haprion",
    "psycopg[binary,pool]>=3.3,<4",
    "fastapi>=0.115,<1",
    # A form or an upload read from a handler running in the thread pool,
    # which is where every handler that touches the database runs.
    "anyio>=4.5,<5",
    "uvicorn>=0.34,<1",
    "jinja2>=3.1,<4",
    #
    # Argon2id is named in the phase gate and enforced by a CHECK constraint on
    # the hash column, so the algorithm is not an implementation detail this
    # file gets to change quietly.
    #
    "argon2-cffi>=23.1,<26",
    # FastAPI parses form posts only when this is present; the login form is one.
    "python-multipart>=0.0.20,<1",
]

#
# The account tool is part of this distribution rather than a script beside it,
# so it shares the password hashing with the login path it exists to serve. Two
# implementations of Argon2 parameters is two places for them to disagree.
#
[project.scripts]
haprion-user = "haprion_ui.admin:_entry"
haprion-settings = "haprion_ui.settings_tool:_entry"
haprion-profiles = "haprion_ui.profile_apply:_entry"
haprion-export = "haprion_ui.export_tool:_entry"
haprion-poller = "haprion_ui.poller:_entry"
haprion-worker = "haprion_ui.worker:_entry"

[dependency-groups]
#
# The migration tool, apart from what the services run. A release carries it
# beside its migrations (migration/lib), outside the services' environment, so
# a running service has no schema tool on its path; the database role it
# connects as is what forbids DDL.
#
migrate = ["alembic==1.19.1"]
dev = [
    { include-group = "migrate" },
    # Test-only. FastAPI's TestClient drives the application in-process through
    # httpx2, so the login flow is exercised as HTTP - cookies, redirects and
    # form posts included - rather than by calling the handlers directly.
    # Starlette 1.x reads httpx2 and warns on httpx (review 2026-10-20).
    "httpx2==2.13.1",
    "mypy==2.3.1",
    #
    # Test-only, and a real browser. The interface ships four hand-written
    # scripts, and the faults they have had are the ones only a browser has:
    # `href` on an SVG link is an `SVGAnimatedString` rather than a string, and
    # a stand-in DOM either implements that correctly by accident or not at
    # all. A test that passes where the fault is is worse than no test.
    #
    "playwright==1.62.0",
    "ruff==0.16.4",
    # The tests read YAML; the engine's dev group pins the same stubs.
    "types-PyYAML==6.0.12.20260815",
]

#
# The engine is a path dependency, not a published one. There is no index to
# fetch it from and there should not be: the interface and the command line are
# built from the same tree at the same commit, which is what keeps them from
# disagreeing about a result envelope.
#
[tool.uv.sources]
haprion = { path = "..", editable = true }

[tool.setuptools.packages.find]
where = ["src"]

#
# The templates are part of the code, not assets beside it. Without this they
# are missing from the wheel, and the failure shows up as a TemplateNotFound at
# the first page view of a release that installed cleanly.
#
[tool.setuptools.package-data]
haprion_ui = ["templates/*.html", "static/*.css", "static/*.js", "static/*.svg", "static/*.woff2", "py.typed", "compatibility.json"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "S", "SIM", "EXE", "RUF100"]

#
# The tests need literal passwords, and S105/S106 exist to find exactly that
# shape. Ignored here rather than annotated line by line: a test that signs in
# has to supply a password, and a `noqa` on every one of them trains the reader
# to skip the marker in the place it would matter.
#
# Narrow on purpose - only these two rules, only under tests/.
#
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "migrations", "tests"]
