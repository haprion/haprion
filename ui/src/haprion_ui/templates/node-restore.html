{% extends "layout.html" %}
{% from "_back.html" import back_button %}
{% block title %}Restore {{ restore.node }} — Haprion{% endblock %}
{#
  Kept current while a job is queued or running, as /jobs is: redrawn in place
  by live.js, with a meta refresh inside <noscript> for a browser without
  JavaScript. A page left open in a tab ends up showing the answer.
#}
{% block head_extra %}{% if restore.active %}<meta name="haproxy-live" content="5">{% if request.method == 'GET' %}<noscript><meta http-equiv="refresh" content="5"></noscript>{% endif %}{% endif %}<script defer src="{{ url_for('static', path='/copy-command.js') }}?v={{ asset_token }}"></script>{% endblock %}
{% block content %}
{% set plan = restore.plan %}{% set facts = restore.target_facts %}
<section class="page-heading">
  <div class="heading-title">{{ back_button('/backups', 'Node backups') }}<h1>Restore {{ restore.node }}</h1><p class="page-lede">{{ restore.cluster }} · archive <code>{{ restore.archive }}</code> · onto {{ restore.target }} · run <code>{{ restore.run }}</code></p></div>
  <div class="heading-badges"><span class="mode-badge"><span class="status-dot status-{{ {'test': 'info', 'overwrite': 'critical'}.get(restore.mode, 'warning') }}"></span>{{ {'test': 'Test restore', 'overwrite': 'Overwrite the node'}.get(restore.mode, 'Restore as the node') }}</span></div>
</section>

<ol class="restore-steps" aria-label="Restore steps">
  {% for key, name in (('prepare', 'Prepare'), ('preview', 'Preview'), ('run', 'Restore')) %}
  <li class="restore-step restore-step-{{ steps[key] }}"><span class="status-dot status-{{ {'done': 'healthy', 'current': 'info', 'failed': 'critical', 'waiting': 'unknown'}[steps[key]] }}" aria-hidden="true"></span>{{ name }}</li>
  {% endfor %}
</ol>

<div class="cluster-list restore-cards">
{% if problem %}
<p class="preview-notice form-problem"><span class="status-orb status-critical" aria-hidden="true"></span><strong>{{ problem }}</strong></p>
{% endif %}

{% if restore.stage == 'working' %}
<p class="preview-notice"><span class="badge-spinner" aria-hidden="true"></span><strong>{{ restore.working }}.</strong> This page refreshes by itself.</p>
{% elif restore.stage == 'prepare_failed' %}
<p class="preview-notice form-problem"><span class="status-orb status-critical" aria-hidden="true"></span><strong>The restore could not be prepared: {{ restore.error }}</strong></p>
{% elif restore.stage == 'done' %}
<p class="preview-notice notice-done"><span class="status-orb status-healthy" aria-hidden="true"></span><strong>Restored.</strong> {{ restore.result.hostname or restore.node }} answers on {{ restore.result.address or '—' }}; the one-time key has been removed.</p>
{% elif restore.stage == 'failed' %}
<p class="preview-notice form-problem"><span class="status-orb status-critical" aria-hidden="true"></span><strong>The restore stopped{% if restore.failed_stage %} in {{ restore.failed_stage }}{% endif %}: {{ restore.error }}</strong></p>
{% if not restore.failed_stage and not restore.rolled_back %}<p class="table-note">The helper's answer could not be read, so whether anything was written is not known. Check the node before anything else.</p>
{% elif restore.mode == 'overwrite' %}<p class="table-note">{% if restore.rolled_back %}The node was put back from its copy and keepalived started again.{% else %}The node was not put back. Check its console before anything else.{% endif %}</p>
{% else %}<p class="table-note">{% if restore.rolled_back %}The network was rolled back: the VM is on its temporary address again.{% else %}The network was not rolled back. Check the VM's console before anything else.{% endif %}</p>{% endif %}
{% elif restore.stage == 'unknown' %}
<p class="preview-notice notice-warning"><span class="status-orb status-warning" aria-hidden="true"></span><strong>Outcome unknown.</strong> The restore's answer never arrived, and it may have changed the node.</p>
{% if restore.standing %}<p class="table-note">{{ restore.standing }}</p>{% endif %}
{% elif restore.stage == 'expired' %}
<p class="preview-notice"><span class="status-orb status-unknown" aria-hidden="true"></span><strong>Expired.</strong> A run has an hour from being prepared to being started, and this one's ended at {{ expires }}. Start the restore again from the backup page. This manager removes the run's one-time key, and the VM stops accepting it by itself.</p>
{% elif restore.stage == 'discarded' %}
<p class="preview-notice"><span class="status-orb status-unknown" aria-hidden="true"></span><strong>Discarded.</strong> The run and its one-time key are gone from this manager. A line already pasted on the VM stops working by itself.</p>
{% endif %}
{% if restore.error and not restore.problems and restore.stage not in ('prepare_failed', 'failed', 'unknown') %}
<p class="preview-notice form-problem"><span class="status-orb status-critical" aria-hidden="true"></span><strong>{{ restore.error }}</strong></p>
{% endif %}

{% if restore.warnings %}
<section class="cluster-card"><header class="cluster-header"><div class="section-title"><h3>Warnings</h3></div></header>
  <ul class="restore-list">{% for warning in restore.warnings %}{% set command = restore.warning_commands[loop.index0] if restore.warning_commands | length > loop.index0 else '' %}<li>{{ warning }}{% if command %}<div class="copy-row restore-paste"><pre class="receiver-command" data-copy-beside><code>{{ command }}</code></pre></div>{% endif %}</li>{% endfor %}</ul>
</section>
{% endif %}

{% if restore.stage == 'fingerprint' and editable %}
<section class="cluster-card">
  <header class="cluster-header"><div class="section-title"><h3>1 · Paste on the target, as its administrator</h3><p>Adds this manager's one-time key for root, shows the line that landed and prints the host key fingerprint. On a new VM, paste it on the console. Start the restore by {{ expires }}; after that the run expires and starts again.</p></div></header>
  <div class="copy-row restore-paste"><pre class="receiver-command" data-copy-beside><code>{{ restore.paste }}</code></pre></div>
  <form method="post" action="/backups/restore/{{ restore.run }}/preview" class="preview-form restore-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="idempotency_key" value="{{ new_request_key() }}">
    <div class="form-grid restore-form-grid">
      <div class="field">
        <label class="field-title" for="restore-fingerprint">2 · The fingerprint line it printed</label>
        <input id="restore-fingerprint" name="fingerprint" type="text"{% if restore.mode == 'test' %} required{% endif %} maxlength="512" autocomplete="off" spellcheck="false" placeholder="256 SHA256:… root@… (ED25519)" autofocus>
        <small>The whole line, or just its SHA256:… part. Read on the console, not over the network: it is what tells this manager the VM it reaches is the one you are looking at.</small>
      </div>
    </div>
    <div class="editor-actions editor-submit"><div class="form-buttons form-buttons-end"><button type="submit" class="secondary-button deploy-button">Preview the restore</button></div></div>
  </form>
</section>
{% endif %}

{% if restore.problems %}
<section class="cluster-card"><header class="cluster-header"><div class="section-title"><h3>What stops this restore</h3></div></header>
  <ul class="restore-list">{% for item in restore.problems %}<li>{{ item }}</li>{% endfor %}</ul>
  <div class="editor-actions editor-submit"><p class="table-note">Nothing was written to the VM. Put it right and preview again above, or leave this run.</p><div class="form-buttons"><a class="secondary-button" href="/backups">Back to backups</a></div></div>
</section>
{% endif %}

{% if plan and restore.stage in ('fingerprint', 'confirm') %}
<section class="cluster-card">
  <header class="cluster-header"><div class="section-title"><h3>The plan</h3><p>What the restore writes on {{ restore.target }}{% if facts %} ({{ facts.hostname }}, {{ facts.os_release.ID }} {{ facts.os_release.VERSION_ID }}){% endif %}.</p></div></header>
  <dl class="restore-plan">
    <div><dt>Becomes</dt><dd>{{ plan.hostname }} on {{ plan.address }}{% if plan.hostname != plan.source_hostname %} · from the archive of {{ plan.source_hostname }}{% endif %}</dd></div>
    {% if facts %}<div><dt>Interface</dt><dd>{{ facts.interface.name }} · {{ facts.interface.mac }} · host key {{ facts.fingerprint }}</dd></div>{% endif %}
    <div><dt>keepalived</dt><dd>{{ 'Started as BACKUP' if plan.keepalived == 'start' else 'Masked — never started' }}</dd></div>
    <div><dt>Packages</dt><dd>{{ plan.packages | join(', ') if plan.packages else 'None missing' }}</dd></div>
    {% if plan.mode == 'overwrite' %}
    <div><dt>Changes</dt><dd>{{ plan.changed | length }} of {{ plan.changed | length + plan.unchanged }} files{% if plan.changed %}: {% for path in plan.changed %}<code>{{ path }}{% if not loop.last %},{% endif %}</code> {% endfor %}{% endif %}{% if '/root/.ssh/authorized_keys' in plan.changed %} · root's keys lose the one-time key{% endif %}</dd></div>
    {% if plan.quarantined %}<div><dt>To quarantine</dt><dd>{% for path in plan.quarantined %}<code>{{ path }}{% if not loop.last %},{% endif %}</code> {% endfor %}</dd></div>{% endif %}
    {% endif %}
    <div><dt>Accounts</dt><dd>{% for account in plan.accounts %}{{ account.name }}{% if not loop.last %}, {% endif %}{% endfor %}</dd></div>
    {% if restore.renumbered %}<div><dt>Other numbers</dt><dd>{{ restore.renumbered | join('; ') }} · files are owned by name</dd></div>{% endif %}
    {% if plan.mode != 'overwrite' %}<div><dt>Files</dt><dd>{{ plan.files | length }} files{% if plan.equal_directories %} · made equal to the archive: {{ plan.equal_directories | join(', ') }}{% endif %}</dd></div>{% endif %}
    {% if restore.node_package %}<div><dt>Node package</dt><dd><code>haprion-node {{ restore.node_package.version }}</code> from this manager's release writes the node scripts{% if plan.from_package %} in place of the archive's {{ plan.from_package | length }}{% endif %}{% if plan.traffic_log %} · turns the traffic log on, as it was{% endif %}</dd></div>{% endif %}
    {% if restore.waf_engine %}<div><dt>WAF engine</dt><dd><code>haprion-coraza-spoa {{ restore.waf_engine.version }}</code> from this manager's release, as the node ran it</dd></div>{% endif %}
    {% if plan.left_out and plan.mode != 'overwrite' %}<div><dt>Not from the archive</dt><dd>{% for path in plan.left_out %}<code>{{ path }}{% if not loop.last %},{% endif %}</code> {% endfor %} · the VM keeps its own, and old <code>.replaced-</code> copies stay behind; an operator's own file among these comes back only when named in <code>EXTRA_BACKUP_PATHS</code></dd></div>{% endif %}
    {% if plan.mode == 'overwrite' and plan.network_unchanged %}<div><dt>Network</dt><dd>Unchanged · not applied</dd></div>
    {% else %}<div><dt>Network, last</dt><dd>{{ plan.network | join(', ') }} · rolled back by itself if this manager cannot reach the node afterwards</dd></div>{% endif %}
  </dl>
  {% if plan.rewrites %}
  <div class="table-scroll"><table class="node-table restore-rewrite-table"><thead><tr><th>Rewritten</th><th>Field</th><th>From</th><th>To</th></tr></thead><tbody>
    {% for rewrite in plan.rewrites %}<tr><td data-label="Rewritten"><code>{{ rewrite.path }}</code></td><td data-label="Field">{{ rewrite.field }}</td><td data-label="From">{{ rewrite.old }}</td><td data-label="To">{{ rewrite.new }}</td></tr>{% endfor %}
  </tbody></table></div>
  {% endif %}
</section>
{% endif %}

{% if restore.stage == 'confirm' and editable and restore.mode == 'overwrite' %}
{% set standing = restore.overwrite or {} %}
<form method="post" action="/backups/restore/{{ restore.run }}/run" class="preview-form restore-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="idempotency_key" value="{{ new_request_key() }}">
  <section class="cluster-card">
    <header class="cluster-header"><div class="section-title"><h3>Overwrite {{ restore.confirm_name }}</h3></div></header>
    <div class="preview-notice form-problem restore-overwrite-warning">
      <span class="status-orb status-critical" aria-hidden="true"></span>
      <div>
        <p><strong>{{ restore.confirm_name }} is in service.</strong> {{ plan.changed | length }} of {{ plan.changed | length + plan.unchanged }} files differ from the archive. A copy of everything written is kept on the node and put back if it does not come up.</p>
        <p><strong>VIP:</strong> {% if standing.vip_owner %}{{ restore.confirm_name }} holds it; keepalived stops first and it moves to {{ standing.neighbour }}{% if standing.neighbour_healthy %}, which is healthy{% else %}, which is <strong>not healthy</strong>{% if standing.detail %} ({{ standing.detail }}){% endif %}{% endif %}.{% elif standing.vip_owner is none %}whether {{ restore.confirm_name }} holds it could not be read; {{ standing.neighbour }} is {% if standing.neighbour_healthy %}healthy{% else %}<strong>not healthy</strong>{% endif %}.{% else %}{{ standing.neighbour }} holds it{% if standing.neighbour_healthy %} and is healthy{% else %} and is <strong>not healthy</strong>{% if standing.detail %} ({{ standing.detail }}){% endif %}{% endif %}. keepalived on {{ restore.confirm_name }} stops during the restore and starts again as BACKUP.{% endif %}</p>
        <p><strong>Backup:</strong> {% if restore.backup_failed %}none could be taken — {{ standing.backup_error }}{% else %}{{ restore.cluster }} was backed up at the preview.{% endif %}</p>
      </div>
    </div>
    <div class="form-grid restore-form-grid">
      {% if restore.backup_failed or restore.traffic_at_risk %}
      <div class="field">
        <div class="form-checks form-checks-stacked method-choices">
          {% if restore.backup_failed %}<label class="check"><input type="checkbox" name="backup_failed_ok" value="yes" required> <span>Go on without a backup</span></label>{% endif %}
          {% if restore.traffic_at_risk %}<label class="check"><input type="checkbox" name="break_traffic" value="yes" required> <span><strong>This WILL break live traffic</strong></span></label>{% endif %}
        </div>
      </div>
      {% endif %}
      <div class="field">
        <label class="field-title" for="restore-confirm">Type <code>{{ restore.confirm_name }}</code> to confirm</label>
        <input id="restore-confirm" name="confirm" type="text" required maxlength="63" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="editor-actions editor-submit"><div class="form-buttons form-buttons-end"><button type="submit" class="secondary-button deploy-button">Overwrite {{ restore.confirm_name }}</button></div></div>
  </section>
</form>
{% elif restore.stage == 'confirm' and editable %}
<form method="post" action="/backups/restore/{{ restore.run }}/run" class="preview-form restore-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="idempotency_key" value="{{ new_request_key() }}">
  <section class="cluster-card">
    <header class="cluster-header"><div class="section-title"><h3>Restore</h3><p>{% if restore.mode == 'test' %}A test: the node's production address and VIP are never used.{% else %}The VM becomes {{ restore.confirm_name }}, on its production address. Its neighbour keeps the VIP.{% endif %} Everything on {{ restore.target }} the plan names is overwritten: its network configuration, hostname, accounts, root's SSH keys{% if restore.mode != 'test' %}, its SSH host keys{% endif %} and the product's files. Only the network is put back by itself if the node cannot be reached afterwards.</p></div></header>
    <div class="form-grid restore-form-grid">
      <div class="field">
        <label class="field-title" for="restore-confirm">Type <code>{{ restore.confirm_name }}</code> to confirm</label>
        <input id="restore-confirm" name="confirm" type="text" required maxlength="63" autocomplete="off" spellcheck="false" autofocus>
      </div>
    </div>
    <div class="editor-actions editor-submit"><p class="table-note">The restore takes about a minute. The cluster's other jobs wait until it is done.</p><div class="form-buttons"><button type="submit" class="secondary-button deploy-button">Restore {{ restore.confirm_name }}</button></div></div>
  </section>
</form>
{% endif %}

{% set leaving = restore.stage in ('prepare_failed', 'done', 'failed', 'expired', 'discarded') %}
{% if leaving or (restore.discardable and editable) or (restore.askable and editable) %}
<div class="form-buttons restore-leave">
  {% if restore.askable and editable %}<form method="post" action="/backups/restore/{{ restore.run }}/status">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="idempotency_key" value="{{ new_request_key() }}">
    <button type="submit" class="secondary-button deploy-button">Ask for the outcome</button>
  </form>{% endif %}
  {% if leaving %}<a class="secondary-button{% if restore.stage == 'done' %} deploy-button{% endif %}" href="/backups">Back to node backups</a>{% endif %}
  {% if restore.discardable and editable %}<form method="post" action="/backups/restore/{{ restore.run }}/discard" class="restore-discard">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="idempotency_key" value="{{ new_request_key() }}"><input type="hidden" name="return_to" value="backups">
    <button type="submit" class="secondary-button">Discard this run</button>
  </form>{% endif %}
</div>
{% endif %}
</div>
{% if restore.stage in ('prepare_failed', 'failed', 'unknown') or restore.error %}<p class="table-note">Jobs in this run: {% for job in restore.jobs %}<a href="/jobs#job-{{ job.id }}">#{{ job.id }}</a> {{ job.state }}{% if not loop.last %} · {% endif %}{% endfor %}</p>{% endif %}
{% endblock %}
