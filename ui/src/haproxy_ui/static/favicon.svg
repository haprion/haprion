<?xml version="1.0" encoding="UTF-8"?>
<!--
  The brand mark from the header, standing alone. Same geometry and same brand
  green, so the tab and the page agree about what this application is.

  Local like the fonts and the stylesheet: the interface has to work while the
  network it manages is broken. Without a favicon the browser asks for
  /favicon.ico on every navigation, is refused, and falls back to the blank
  page icon - which is the flicker the tab showed on each page load.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <g fill="none" stroke="#2fb344" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 8h13M6 16h20M6 24h13"/>
    <circle cx="22" cy="8" r="3"/>
    <circle cx="10" cy="24" r="3"/>
  </g>
</svg>
