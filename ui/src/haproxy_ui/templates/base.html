{#
  Every page shares this shell and its local assets. The interface must remain
  usable while the network it manages is broken, so fonts, scripts and styles
  never come from a CDN.
#}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}HAProxy Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <script src="{{ url_for('static', path='/theme.js') }}" defer></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block chrome %}{% endblock %}
  <main class="{% block main_class %}page{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
